# Builds the site as static files and publishes it to GitHub Pages on every push to main.
# Live at https://sureshbjra.github.io/rr-dental-website/ (or your custom domain once one is set
# in Settings → Pages; the base path below then becomes "" automatically).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a release in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: "true"
          # "/rr-dental-website" on github.io, "" on a custom domain
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
